services:

  config-server:
    image: hridmitrov/config-server:s9
    container_name: config-server
    restart: always
    ports:
      - "8071:8071"
    deploy:
      resources:
        limits:
          memory: 1024m
    networks:
      - "banking-network"

  eureka-server:
    image: hridmitrov/eureka-server:s9
    container_name: eureka-server
    restart: always
    ports:
      - "8070:8070"
    deploy:
      resources:
        limits:
          memory: 1024m
    environment:
      CONFIG_SERVER_URL: http://config-server:8071
    depends_on:
      config-server:
        condition: service_started
    networks:
      - "banking-network"

  accounts-service:
    image: hridmitrov/accounts-service:s9
    container_name: accounts-ms
    restart: always
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 1024m
    networks:
      - "banking-network"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8071
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

  loans-service:
    image: hridmitrov/loans-service:s9
    container_name: loans-ms
    restart: always
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 1024m
    networks:
      - "banking-network"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8071
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

  cards-service:
    image: hridmitrov/cards-service:s9
    container_name: cards-ms
    restart: always
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 1024m
    networks:
      - "banking-network"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8071
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

  redis:
    image: redis:7.4.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - "banking-network"

  gateway-server:
    image: hridmitrov/gateway-server:s9
    container_name: gateway-server
    restart: always
    ports:
      - "8072:8072"
    deploy:
      resources:
        limits:
          memory: 1024m
    networks:
      - "banking-network"
    environment:
      CONFIG_SERVER_URL: http://config-server:8071
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

networks:
  banking-network:
    driver: bridge