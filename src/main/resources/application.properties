spring.application.name=accounts-service
spring.profiles.active=prod

spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8071}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8070/eureka/

eureka.instance.prefer-ip-address=true

info.app.name=accounts
info.app.description=accounts application
info.app.version=1.0.0

management.info.env.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.shutdown.access=unrestricted

logging.level.com.dimihris.accountsservice=debug

spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10000
