spring.application.name=accounts-service
spring.profiles.active=prod

spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8071}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8070/eureka/

eureka.instance.prefer-ip-address=true

info.app.name=accounts
info.app.description=accounts application
info.app.version=1.0.0

management.info.env.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.shutdown.access=unrestricted

logging.level.com.dimihris.accountsservice=debug

spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10000

resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=100
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
resilience4j.retry.configs.default.ignore-exceptions[0]=java.lang.NullPointerException

# Complete Feign fallbacks before the gateway's outer circuit breaker times out.
resilience4j.timelimiter.configs.default.timeout-duration=1000
resilience4j.ratelimiter.configs.default.limit-refresh-period=5000
resilience4j.ratelimiter.configs.default.limit-for-period=1
